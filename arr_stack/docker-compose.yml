# Usenet *arr stack for SpoonBox (macOS, OrbStack or Docker Desktop).
# Downloads and the library share one DATA_ROOT on a single drive, so Sonarr/Radarr
# can move finished downloads into the library instantly (no copy, no double disk use).
#
#   ${DATA_ROOT}/usenet/{incomplete,complete/{tv,movies}}
#   ${DATA_ROOT}/media/{tv,movies}
#
# Copy .env.example to .env, set DATA_ROOT, then: docker compose up -d
services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment: &env
      PUID: ${PUID:-501}
      PGID: ${PGID:-20}
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./config/sabnzbd:/config
      - ${DATA_ROOT}:/data
    ports: ["8080:8080"]
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *env
    volumes:
      - ./config/prowlarr:/config
    ports: ["9696:9696"]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *env
    volumes:
      - ./config/sonarr:/config
      - ${DATA_ROOT}:/data
    ports: ["8989:8989"]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *env
    volumes:
      - ./config/radarr:/config
      - ${DATA_ROOT}:/data
    ports: ["7878:7878"]
    restart: unless-stopped

  # Optional request UI ("add this show") for phone/TV. Enable once the rest works.
  # 5055 on SpoonBox is already the Spirit Island TV page, so it is published on 5056.
